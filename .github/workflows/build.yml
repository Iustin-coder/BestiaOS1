name: Compilare BestiaOS Oglinda Stabila

on:
  workflow_dispatch: # Pornire manuala din interfata

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Eliberare Spatiu Brut si Agresiv (Deblocare ~100GB)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
        sudo docker image prune --all --force
        sudo apt-get clean

    - name: Instalare Dependente Linux Nucleu
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        mkdir -p ~/bin
        curl -s https://googlesource.com | base64 --decode > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Configurare Automata Git
      run: |
        git config --global user.name "BestiaOS Core Developer"
        git config --global user.email "developer@bestiaos.world"

    - name: Descarcare inteligenta cu Oglinda de Rezerva
      run: |
        mkdir android-source && cd android-source
        export PATH=~/bin:$PATH
        
        # Folosim o oglinda alternativa (Mirror) extrem de stabila pentru a evita blocajele de retea
        repo init -u https://gitlab.com -b lineage-21.0 --git-lfs --depth=1
        
        # Cream configurarea locala pentru Redmi K20 Pro Premium (raphael)
        mkdir -p .repo/local_manifests
        cat <<EOF > .repo/local_manifests/raphael.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="LineageOS/android_device_xiaomi_raphael" path="device/xiaomi/raphael" remote="github" revision="lineage-21.0" />
          <project name="LineageOS/android_kernel_xiaomi_sm8150" path="kernel/xiaomi/sm8150" remote="github" revision="lineage-21.0" />
          <project name="TheMuppets/proprietary_vendor_xiaomi_raphael" path="vendor/xiaomi/raphael" remote="github" revision="lineage-21.0" />
        </manifest>
        EOF
        
        # Incercam descarcarea de 3 ori automat in caz ca serverul de retea are micro-intreruperi
        for i in {1..3}; do repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune && break || sleep 15; done

    - name: Branding si Injectare Optimizari Supreme BestiaOS
      run: |
        cd android-source
        CONFIG_PATH=$(find vendor/ -name "common.mk" | head -n 1)
        
        if [ ! -z "$CONFIG_PATH" ]; then
            DIR_BRANDING=$(dirname "$CONFIG_PATH")
            find "$DIR_BRANDING" -type f -name "*.mk" -exec sed -i 's/LineageOS/BestiaOS/g' {} +
            find "$DIR_BRANDING" -type f -name "*.mk" -exec sed -i 's/lineage_/bestia_/g' {} +
            
            echo "PRODUCT_PROPERTY_OVERRIDES += ro.build.display.id=BestiaOS_v1.0-Premium" >> "$CONFIG_PATH"
            echo "PRODUCT_PROPERTY_OVERRIDES += ro.bestia.version=1.0-Ultimate" >> "$CONFIG_PATH"
            echo "PRODUCT_PROPERTY_OVERRIDES += ro.bestia.device=raphael" >> "$CONFIG_PATH"
            echo "PRODUCT_PROPERTY_OVERRIDES += ro.vendor.qti.sys.fw.bg_apps_limit=60" >> "$CONFIG_PATH"
            echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapstartsize=16m" >> "$CONFIG_PATH"
            echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapgrowthlimit=384m" >> "$CONFIG_PATH"
            echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapsize=512m" >> "$CONFIG_PATH"
        fi

    - name: Compilare Automata Robotizata
      run: |
        cd android-source
        export PATH=~/bin:$PATH
        
        # Daca totusi fisierele lipsesc complet, scriptul se va opri curat explicand eroarea de retea exterioara
        if [ ! -f "build/envsetup.sh" ]; then
            echo "Eroare severa: Oglinda de retea nu a putut livra fisierele la timp. Se reincearca local..."
            exit 1
        fi
        
        source build/envsetup.sh
        lunch lineage_raphael-userdebug || lunch $(lunch | head -n 1)
        mka bacon -j$(nproc --all)

    - name: Livrare Pachet .zip Gata de Instalat
      uses: actions/upload-artifact@v4
      with:
        name: BestiaOS-v1.0-RedmiK20ProPremium
        path: android-source/out/target/product/raphael/*.zip
