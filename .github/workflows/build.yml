name: Build Dinamic BestiaOS (Redmi K20 Pro Premium)

on:
  workflow_dispatch: # Permite pornirea manuală din tab-ul Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Verificare Cod Repository
      uses: actions/checkout@v4

    - name: Maximizare Dinamică Spațiu pe Disc (Curățare Completă)
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Configurare Automată Dependențe și Pachete Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev jq

    - name: Descărcare Dinamică Instrument Repo (Caută automat link-ul oficial stabil)
      run: |
        mkdir -p ~/bin
        # Folosește API-ul GitHub pentru a extrage automat URL-ul ultimei versiuni stabile de repo
        REPO_URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name=="repo") | .browser_download_url')
        
        # Dacă API-ul dă eroare, folosește un fallback inteligent direct din ramura principală
        if [ -z "$REPO_URL" ] || [ "$REPO_URL" == "null" ]; then
          REPO_URL="https://githubusercontent.com"
        fi
        
        echo "Descărcare dinamică 'repo' de la: $REPO_URL"
        curl -sSL "$REPO_URL" > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sincronizare Surse Android (Inițializare BestiaOS)
      run: |
        git config --global user.name "BestiaOS Developer"
        git config --global user.email "developer@bestiaos.local"
        mkdir -p ~/android
        cd ~/android
        # Inițializează și descarcă doar istoricul minim (--depth=1) pentru a economisi spațiu
        repo init -u https://github.com -b lineage-22.0 --git-lfs --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Preluare Automată și Dinamică Drivere Redmi K20 Pro Premium (raphael)
      run: |
        cd ~/android
        
        # Detectează automat dacă există ramura de Android 15 (lineage-22), altfel face fallback la cea mai recentă versiune disponibilă
        get_best_branch() {
          local repo_name=$1
          if git ls-remote --heads "https://github.com" | grep -q "refs/heads/lineage-22.0"; then
            echo "lineage-22.0"
          else
            echo "lineage-21.0"
          fi
        }

        DEVICE_BRANCH=$(get_best_branch "LineageOS/android_device_xiaomi_raphael")
        KERNEL_BRANCH=$(get_best_branch "LineageOS/android_kernel_xiaomi_raphael")
        VENDOR_BRANCH=$(get_best_branch "TheMuppets/proprietary_vendor_xiaomi_raphael")

        echo "Sursă Device Tree identificată dinamic pe ramura: $DEVICE_BRANCH"
        git clone https://github.com -b "$DEVICE_BRANCH" device/xiaomi/raphael --depth=1
        
        echo "Sursă Kernel identificată dinamic pe ramura: $KERNEL_BRANCH"
        git clone https://github.com -b "$KERNEL_BRANCH" kernel/xiaomi/raphael --depth=1
        
        echo "Sursă Vendor identificată dinamic pe ramura: $VENDOR_BRANCH"
        git clone https://github.com -b "$VENDOR_BRANCH" vendor/xiaomi/raphael --depth=1

    - name: Compilare Sistem de Operare (Bake BestiaOS)
      run: |
        cd ~/android
        source build/envsetup.sh
        lunch lineage_raphael-userdebug
        mka bacon -j$(nproc --all)

    - name: Încărcare Produs Final (Arhivă BestiaOS .zip)
      uses: actions/upload-artifact@v4
      with:
        name: BestiaOS-RedmiK20Pro-Stable
        path: ~/android/out/target/product/raphael/*.zip
