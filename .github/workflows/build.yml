name: Build bestiaOS

on:
  workflow_dispatch: # Permite rularea manuală din tab-ul Actions pe GitHub
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Eliberare spațiu pe disc (Crucial pentru Android)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalare dependențe Python
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Rulează scriptul de verificare și curățare bestiaOS
      run: python bestia_check.py

    - name: Inițializare și compilare (Placeholder)
      run: |
        echo "Spațiul liber pe disc:"
        df -h
        echo "Aici adaugi comenzile de repo init, sync superficial și build pentru bestiaOS."
