name: Build BestiaOS pentru Redmi K20 Pro Premium

on:
  workflow_dispatch: # Îți permite să pornești compilarea manual din tab-ul Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Verificare Cod Repository
      uses: actions/checkout@v4

    - name: Eliberare Spațiu pe Disk (Crucial pentru Android)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Configurare Mediu de Lucru și Dependențe
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Instalare Instrument Repo (Google)
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sincronizare Surse Android (Exemplu cod BestiaOS/AOSP)
      run: |
        git config --global user.name "BestiaOS Developer"
        git config --global user.email "developer@bestiaos.local"
        mkdir -p ~/android
        cd ~/android
        # Aici vei înlocui cu manifest-ul tău de Android 15 când este gata
        repo init -u https://github.com -b lineage-22.0 --git-lfs --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Descărcare Drivere Specifice Redmi K20 Pro Premium (raphael)
      run: |
        cd ~/android
        # Clonează copacii de cod (Device, Kernel, Vendor) pentru telefonul tău
        # ATENȚIE: Link-urile de mai jos trebuie să indice spre ramurile compatibile cu Android 15 (când apar)
        git clone https://github.com -b lineage-21 device/xiaomi/raphael --depth=1
        git clone https://github.com -b lineage-21 kernel/xiaomi/raphael --depth=1
        git clone https://github.com -b lineage-21 vendor/xiaomi/raphael --depth=1

    - name: Compilare ROM (Bake BestiaOS)
      run: |
        cd ~/android
        source build/envsetup.sh
        lunch lineage_raphael-userdebug
        mka bacon -j$(nproc --all)

    - name: Încărcare Produs Final (ROM .zip)
      uses: actions/upload-artifact@v4
      with:
        name: BestiaOS-RedmiK20Pro
        path: ~/android/out/target/product/raphael/*.zip
