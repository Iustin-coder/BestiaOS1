name: Build bestiaOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Eliberare spațiu pe disc (Maxim pe runner)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Instalare unelte de sistem pentru Android
      run: |
        sudo apt-get update
        sudo apt-get install -y git python3 python3-pip curl repo bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev
        git config --global user.name "bestiaOS-Builder"
        git config --global user.email "builder@bestiaos.local"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalare dependențe Python
      run: pip install requests

    - name: Creează automat scriptul de verificare
      run: |
        cat << 'EOF' > bestia_check.py
        import os
        import sys
        import requests

        LINKS_TO_CHECK = []

        def verify_links():
            print("-> Verificare linkuri (se detecteaza pagini HTML în loc de fișiere brute)...")
            for url in LINKS_TO_CHECK:
                try:
                    response = requests.get(url, timeout=10)
                    content_lower = response.text.lower()
                    if "<!doctype" in content_lower or "<html" in content_lower:
                        print(f"EROARE: Linkul {url} returnează o pagină web (HTML), nu fișierul brut!")
                        sys.exit(1)
                    else:
                        print(f"OK: {url}")
                except Exception as e:
                    print(f"Eroare la verificare pentru {url}: {e}")
                    sys.exit(1)

        def aggressive_clean():
            print("-> Curățare agresivă a spațiului pe GitHub Actions...")
            junk_dirs = ["out", ".ccache", "build/temp", ".repo/project-objects"]
            for directory in junk_dirs:
                if os.path.exists(directory):
                    os.system(f"rm -rf {directory}")
                    print(f"S-a șters folderul consumator de spațiu: {directory}")
            print("Curățare finalizată. Spațiu optimizat!")

        if __name__ == "__main__":
            verify_links()
            aggressive_clean()
        EOF

    - name: Rulează scriptul de verificare linkuri și curățare
      run: python bestia_check.py

    - name: Inițializare și Sync Android (Mod Superficial)
      run: |
        mkdir -p ~/android/os
        cd ~/android/os
        repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1
        repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j8

    - name: Compilare bestiaOS
      run: |
        cd ~/android/os
        source build/envsetup.sh
        lunch lineage_arm64-userdebug
        mka bacon -j8
