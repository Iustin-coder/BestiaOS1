name: Build BestiaOS Modular

on:
  workflow_dispatch:

jobs:
  build_bestia:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Cod
      uses: actions/checkout@v4

    # TRUCUL 1: Curățare extremă pentru a elibera ~70-80 GB direct pe VM
    # Acest script elimină pachetele uriașe preinstalate de GitHub
    - name: Maximizare Spațiu Brut (Extrem)
      run: |
        docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h

    - name: Instalare Dependențe Android
      run: |
        sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libssl-dev libxml2-utils lzops pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        
    # TRUCUL 2: Restaurare bucăți compilate anterior (dacă există)
    - name: Restaurare Cache Compilare (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-bestiaos-${{ github.sha }}
        restore-keys: |
          ccache-bestiaos-

    - name: Configurare Utilitar Repo
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        git config --global user.name "BestiaOS Developer"
        git config --global user.email "developer@bestiaos.local"

    # TRUCUL 3: Sincronizare parțială (Doar ce este strict necesar)
    - name: Sincronizare Surse Android
      run: |
        mkdir android-source && cd android-source
        repo init -u https://github.com -b lineage-20.0 --git-lfs --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    # TRUCUL 4: Activare CCACHE pentru a salva progresul pe bucăți
    - name: Configurare CCACHE
      run: |
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 30G # Alocăm 30GB doar pentru bucățile compilate salvate
        ccache -z

    - name: Compilare Modulară BestiaOS
      run: |
        cd android-source
        source build/envsetup.sh
        # lunch lineage_dispozitiv-userdebug
        # m bacon -j$(nproc --all) || echo "Compilarea s-a oprit, dar salvăm progresul!"

    # TRUCUL 5: Verificăm cât s-a compilat și afișăm statistica
    - name: Salvare și Afișare Status Cache
      run: |
        ccache -s
