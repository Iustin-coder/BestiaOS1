name: Compilare BestiaOS pentru Redmi K20 Pro Premium

on:
  workflow_dispatch: # Pornire manuala cu un singur click din interfata

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Curatare Server pentru Spatiu Maxim
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false

    - name: Instalare Dependente Linux Ultimate
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        mkdir -p ~/bin
        curl -s https://googlesource.com | base64 --decode > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Configurare Identitate Git Developer
      run: |
        git config --global user.name "BestiaOS Core Developer"
        git config --global user.email "developer@bestiaos.world"

    - name: Descarca Codul Sursa si Aplica Modificarile BestiaOS
      run: |
        mkdir android-source && cd android-source
        export PATH=~/bin:$PATH
        
        # 1. Initializam baza Android 14
        repo init -u https://github.com -b lineage-21.0 --git-lfs --depth=1
        
        # 2. Crearea Local Manifest pentru Redmi K20 Pro Premium (raphael)
        mkdir -p .repo/local_manifests
        cat <<EOF > .repo/local_manifests/raphael.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="LineageOS/android_device_xiaomi_raphael" path="device/xiaomi/raphael" remote="github" />
          <project name="LineageOS/android_kernel_xiaomi_sm8150" path="kernel/xiaomi/sm8150" remote="github" />
          <project name="TheMuppets/proprietary_vendor_xiaomi_raphael" path="vendor/xiaomi/raphael" remote="github" />
        </manifest>
        EOF
        
        # 3. Sincronizam tot sistemul (Fortat, pentru a ne asigura ca se downloadeaza tot)
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        # 4. Branding Complet si Eliminare LineageOS (Acum ca folderul exista garantat)
        cd vendor/lineage
        find . -type f -name "*.mk" -exec sed -i 's/LineageOS/BestiaOS/g' {} +
        find . -type f -name "*.mk" -exec sed -i 's/lineage_/bestia_/g' {} +
        find . -type f -name "*.mk" -exec sed -i 's/LINEAGE_/BESTIAOS_/g' {} +
        
        echo "PRODUCT_PROPERTY_OVERRIDES += ro.build.display.id=BestiaOS_v1.0-Premium" >> config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += ro.bestia.version=1.0-Ultimate" >> config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += ro.bestia.device=raphael" >> config/common.mk
        
        # 5. Aplicare Optimizari Supreme de Performanta si RAM pentru cei 12GB
        cd ../..
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 50G
        
        echo "PRODUCT_PROPERTY_OVERRIDES += ro.vendor.qti.sys.fw.bg_apps_limit=60" >> vendor/lineage/config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapstartsize=16m" >> vendor/lineage/config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapgrowthlimit=384m" >> vendor/lineage/config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapsize=512m" >> vendor/lineage/config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heaptargetutilization=0.75" >> vendor/lineage/config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapminfree=4m" >> vendor/lineage/config/common.mk
        echo "PRODUCT_PROPERTY_OVERRIDES += dalvik.vm.heapmaxfree=16m" >> vendor/lineage/config/common.mk

    - name: Pornire Compilare Monstru
      run: |
        cd android-source
        export PATH=~/bin:$PATH
        source build/envsetup.sh
        
        lunch lineage_raphael-userdebug
        mka bacon -j$(nproc --all)

    - name: Livrare Lansare Mondiala BestiaOS v1.0
      uses: actions/upload-artifact@v4
      with:
        name: BestiaOS-v1.0-RedmiK20ProPremium-Official
        path: android-source/out/target/product/raphael/*.zip
