name: Build BestiaOS Modular cu Verificare Safety

on:
  workflow_dispatch: # Îți permite să pornești build-ul manual din interfața GitHub Actions

jobs:
  pre_check_and_build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Cod
      uses: actions/checkout@v4

    # ==========================================
    # PASUL DE SIGURANȚĂ ȘI VERIFICARE RAPIDĂ
    # ==========================================
    - name: Verificare Sintaxă și Validare Linkuri de Descărcare
      run: |
        echo "=== FAZA 1: Verificare erori de sintaxă în scripturi ==="
        # Caută și verifică toate scripturile de tip .sh din repository
        for script in $(find . -name "*.sh"); do
          echo "Se verifică sintaxa pentru: $script"
          bash -n "$script"
        done
        echo "Sintaxa este corectă! Trecem la linkuri..."

        echo "=== FAZA 2: Testare disponibilitate linkuri esențiale ==="
        # Listă de linkuri critice și corectate pe care Android le folosește pentru descărcare
        LINKURI=(
          "https://googleapis.com"
          "https://github.com"
          "https://googlesource.com"
        )

        for url in "${LINKURI[@]}"; do
          echo "Se testează conexiunea către: $url"
          # Trimite o cerere rapidă și verifică dacă serverul răspunde cu succes
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --head --request GET "$url" --connect-timeout 10)
          
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
            echo " [OK] Linkul funcționează perfect (Cod HTTP: $STATUS)"
          else
            echo " [EROARE CRITICĂ] Linkul nu este accesibil sau e picat! (Cod HTTP: $STATUS)"
            echo "Compilarea BestiaOS a fost oprită pentru a preveni un eșec mai târziu."
            exit 1 # Oprește forțat workflow-ul GitHub Actions în acest punct exact
          fi
        done
        echo "Toate testele rapide au trecut cu succes! Se pornește compilarea BestiaOS..."

    # ==========================================
    # CURĂȚARE EXTREMĂ PENTRU MAXIMIZARE SPAȚIU
    # ==========================================
    - name: Maximizare Spațiu Brut (Extrem)
      run: |
        echo "Eliminăm pachetele uriașe preinstalate de GitHub pentru a elibera ~70-80 GB..."
        docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h

    # ==========================================
    # INSTALARE DEPENDENȚE ȘI REPO TOOL
    # ==========================================
    - name: Instalare Dependențe Android
      run: |
        sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libssl-dev libxml2-utils lzops pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        
    - name: Restaurare Cache Compilare (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-bestiaos-${{ github.sha }}
        restore-keys: |
          ccache-bestiaos-

    - name: Configurare Utilitar Repo
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
        git config --global user.name "BestiaOS Developer"
        git config --global user.email "developer@bestiaos.local"

    # ==========================================
    # SINCRONIZARE ȘI COMPILARE ANDROID
    # ==========================================
    - name: Sincronizare Surse Android
      run: |
        mkdir android-source && cd android-source
        # Folosim --depth=1 pentru a descărca doar ultima versiune a codului, economisind zeci de giga
        repo init -u https://github.com -b lineage-20.0 --git-lfs --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Configurare CCACHE
      run: |
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 30G # Alocăm spațiu dedicat în mașina virtuală pentru bucățile compilate salvate
        ccache -z

    - name: Compilare Modulară BestiaOS
      run: |
        cd android-source
        source build/envsetup.sh
        # Activează liniile de mai jos (ștergând caracterul '#') când adaugi device tree-ul tău:
        # lunch lineage_dispozitiv-userdebug
        # m bacon -j$(nproc --all) || echo "Compilarea s-a oprit controlat, salvăm progresul în cache!"

    - name: Salvare și Afișare Status Cache
      run: |
        ccache -s
