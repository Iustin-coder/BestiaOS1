name: Build Rapid BestiaOS GSI (Android 15)

on:
  workflow_dispatch: # Permite pornirea manuală din tab-ul Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Verificare Cod Repository
      uses: actions/checkout@v4

    - name: Configurare Mediu de Lucru
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget zip unzip python3 python3-pip openjdk-17-jdk jq

    - name: Descărcare Unelte Modificare GSI (Erfan Tools)
      run: |
        # Am securizat comanda de clonare într-un folder curat
        git clone --depth=1 "https://github.com" /home/runner/ErfanGSIs
        cd /home/runner/ErfanGSIs
        sudo bash setup.sh

    - name: Descărcare Bază Android 15 Oficială (AOSP Treble)
      run: |
        mkdir -p /home/runner/input
        cd /home/runner/input
        # Descarcă imaginea de bază oficială de Android 15 pur, compatibilă Project Treble
        wget -O android15_base.zip "https://google.com"

    - name: Generare și Optimizare BestiaOS pentru Redmi K20 Pro
      run: |
        cd /home/runner/ErfanGSIs
        # Transformă imaginea brută Google într-un ROM flash-uibil (Format AB universal)
        sudo ./url2gsi.sh "/home/runner/input/android15_base.zip" AOSP AB

    - name: Pregătire Fișier ZIP Final
      run: |
        mkdir -p /home/runner/output
        cd /home/runner/ErfanGSIs/output/
        # Redenumim sistemul în BestiaOS
        mv *.img BestiaOS-Android15-RedmiK20Pro.img
        zip -r /home/runner/output/BestiaOS-Android15-RedmiK20Pro.zip BestiaOS-Android15-RedmiK20Pro.img

    - name: Încărcare Produs Final (ROM .zip)
      uses: actions/upload-artifact@v4
      with:
        name: BestiaOS-Android15-RedmiK20Pro
        path: /home/runner/output/*.zip
