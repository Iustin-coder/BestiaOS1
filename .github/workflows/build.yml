name: BestiaOS Build System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Verificare Sintaxă și Linkuri
    runs-on: ubuntu-22.04
    steps:
      - name: Descărcare Cod Rezervor (Checkout)
        uses: actions/checkout@v4

      - name: Verificare Sintaxă YAML
        name: Lint GitHub Actions Workflow
        run: |
          echo "Se verifică structura fișierului..."
          # Folosește un utilitar simplu pentru a valida dacă fișierul este un YAML valid
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/build.yml'))" && echo "Sintaxa YAML este corectă!"

      - name: Validare Linkuri Externe (Link Checker)
        id: link_checker
        run: |
          echo "Se verifică dacă sursele și linkurile externe sunt online..."
          
          # Listă de URL-uri/Surse pe care proiectul tău le folosește (Exemplu)
          URLS=(
            "https://googlesource.com"
            "https://github.com" # Înlocuiește cu manifestul tău real
          )
          
          EROARE=0
          for url in "${URLS[@]}"; do
            echo "Se testează: $url"
            if curl --output /dev/null --silent --head --fail --max-time 10 "$url"; then
              echo "✅ URL-ul este accesibil."
            else
              echo "❌ EROARE CRITICĂ: $url nu poate fi accesat!"
              EROARE=1
            fi
          done
          
          if [ $EROARE -ne 0 ]; then
            echo "::error::Una sau mai multe surse externe sunt indisponibile. Rularea se oprește."
            echo "--- DETALII AVANSATE DE DEPANARE ---"
            echo "1. Verificați dacă serverul extern este în mentenanță."
            echo "2. Asigurați-vă că URL-ul nu conține greșeli de tipar (typos)."
            echo "3. Dacă URL-ul este un repository privat, asigurați-vă că ați configurat un Secret (PAT Token)."
            echo "--- DETALII SUPER AVANSATE ---"
            echo "Eroarea a fost generată de curl cu codul de retur non-zero. Executați local: 'curl -Iv [URL]' pentru a vedea detaliile complete ale strângerii de mână TLS sau erorile DNS."
            exit 1
          fi

  build-android:
    name: Eliberare Spațiu și Compilare BestiaOS
    needs: validate-and-test
    runs-on: ubuntu-22.04
    
    steps:
      - name: Descărcare Cod Rezervor (Checkout)
        uses: actions/checkout@v4

      - name: Maximizare Spațiu pe Disc (Instantly Free Space)
        name: Free Disk Space (Ubuntu)
        run: |
          echo "Spațiu inițial pe disc:"
          df -h
          
          echo "Se elimină pachetele software preinstalate inutile..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /etc/apt/sources.list.d/*
          
          echo "Se curăță cache-ul apt și imaginile Docker..."
          sudo apt-get clean
          sudo docker image prune -a -f
          
          echo "Spațiu final disponibil după curățare:"
          df -h

      - name: Configurare Mediu de Compilare Android
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Inițializare Repo și Compilare (Schelet)
        run: |
          echo "Aici se vor introduce comenzile specifice ROM-ului tău Android"
          echo "Exemplu:"
          # repo init -u https://googlesource.com/platform/manifest -b android-14.0.0_r1
          # repo sync -j$(nproc --all)
          # source build/envsetup.sh
          # lunch bestia_device-userdebug
          # mka bacon
