name: Build BestiaOS (Maximized Space)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-22.04
    
    steps:
    # 1. Descarcă structura repository-ului tău
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. VALIDARE ULTRA-STRICTĂ (Primul pas operativ)
    # Verifică dacă linkurile descarcă un fișier real sau dacă sunt doar pagini HTML simple.
    - name: Strict File Link Verification
      run: |
        echo "=== Începere Validare Linkuri de Descărcare ==="
        
        # Pune aici linkurile tale directe către fișiere (Exemple generice de fișiere reale)
        LINKS=(
          "https://googleapis.com"
          "https://googlesource.com"
        )
        
        FAILED=0
        for link in "${LINKS[@]}"; do
          echo "Se verifică descărcarea directă pentru: $link"
          
          # Preluăm tipul de fișier (Content-Type) prin headerele HTTP (-L urmărește redirecționările)
          CONTENT_TYPE=$(curl -sI -L "$link" | grep -i "content-type" | awk '{print $2}' | tr -d '\r\n')
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --connect-timeout 15 -L "$link")
          
          echo "Status: $STATUS | Tip Conținut: $CONTENT_TYPE"
          
          # Dacă linkul returnează o pagină web normală (text/html), înseamnă că nu descarcă un fișier direct!
          if [[ "$CONTENT_TYPE" == *"text/html"* ]] || [ "$STATUS" -ne 200 ]; then
            echo "--------------------------------------------------"
            echo "❌ EROARE CRITICĂ: Linkul NU descarcă un fișier direct sau este invalid!"
            echo "Link problematic: $link"
            echo "--- DETALII AVANSATE ---"
            echo "Acest URL te trimite către o pagină web vizuală (HTML), nu către un fișier brut (raw/binary)."
            echo "--- DETALII SUPER AVANSATE (DEPANARE) ---"
            echo "1. Dacă linkul este de pe GitHub, folosește butonul 'Raw' pentru a obține linkul direct (ex: ://githubusercontent.com...)."
            echo "2. Dacă linkul provine din Google Source, adaugă '?format=TEXT' la finalul URL-ului pentru a descărcare directă codificată în Base64."
            echo "--------------------------------------------------"
            FAILED=1
          else
            echo "✅ Link VALID (Este un fișier descărcabil direct)."
          fi
        done
        
        if [ $FAILED -ne 0 ]; then
          echo "Validarea a eșuat. Procesul se oprește aici înainte de a consuma resurse."
          exit 1
        fi

    # 3. CURĂȚARE AGRESIVĂ (Metoda Comunității Android - Eliberare Instantă Sute de Gigabit/Zeci de GB)
    # Acest script elimină imagini Docker, unelte .NET, Haskell, Android SDK-uri vechi și cache-uri inutile ale sistemului
    - name: Aggressive Space Optimizer (Community Script)
      run: |
        echo "=== Spațiu inițial pe disc ==="
        df -h /
        
        echo "Dezinstalați pachetele grele preinstalate..."
        sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' 'google-chrome-stable' 'microsoft-edge-stable' azure-cli google-cloud-cli mono-devel powershell firefox targetcli-fb dbus-user-session
        
        echo "Ștergere componente masive și imagini Docker latente..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo docker image prune --all --force
        
        echo "Curățare cache manager pachete..."
        sudo apt-get autoremove -y >/dev/null
        sudo apt-get autoclean -y >/dev/null
        
        echo "=== Spațiu final obținut pentru Compilare ==="
        df -h /

    # 4. Instalarea dependințelor de compilare
    - name: Install Android Build Toolkit
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        mkdir -p ~/bin
        curl -s https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    # 5. Descărcarea surselor BestiaOS folosind optimizări de spațiu limitat
    - name: Repo Init and Sync
      run: |
        git config --global user.name "BestiaOS Builder"
        git config --global user.email "builder@bestiaos.local"
        
        # Schimbă URL-ul de mai jos cu cel către repoul tău manifest
        repo init -u https://googlesource.com -b android-13.0.0_r1
        
        # Folosim --depth=1 pentru a descărca doar codul actual, fără istoricul Git din ultimii 10 ani
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle --depth=1

    # 6. Pornirea Compilării BestiaOS
    - name: Execute Android Compilation
      run: |
        source build/envsetup.sh
        
        # Schimbă cu profilul dispozitivului tău țintă
        lunch aosp_arm64-userdebug
        
        make -j$(nproc)

    # 7. Salvarea fișierelor rezultate ca Artefact
    - name: Upload Output Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BestiaOS-ROM-Package
        path: out/target/product/*/*.zip
        if-no-files-found: warn
