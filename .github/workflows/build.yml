name: Build Rapid BestiaOS GSI (Android 15)

on:
  workflow_dispatch: # Îți permite să pornești compilarea manual din tab-ul Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Verificare Cod Repository
      uses: actions/checkout@v4

    - name: Configurare Mediu de Lucru
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget zip unzip python3 python3-pip openjdk-17-jdk jq

    - name: Descărcare Unelte Modificare GSI (Erfan Tools)
      run: |
        git clone --depth=1 https://github.com ~/ErfanGSIs
        cd ~/ErfanGSIs
        # Instalează cerințele de sistem pentru tool
        sudo bash setup.sh

    - name: Descărcare Bază Android 15 Oficială (Google AOSP)
      run: |
        mkdir -p ~/input
        cd ~/input
        # Descarcă imaginea de bază oficială de Android 15 oferită de Google pentru telefoane Pixel/Treble
        wget -O android15_base.zip https://google.com

    - name: Generare și Optimizare BestiaOS pentru Redmi K20 Pro
      run: |
        cd ~/ErfanGSIs
        # Tool-ul preia imaginea oficială și o transformă într-un format compatibil cu telefoanele Project Treble (cum e Redmi K20 Pro)
        # „AB” este formatul de partiție pentru sistemele noi de Android
        ./url2gsi.sh ~/input/android15_base.zip AB

    - name: Pregătire Fișier ZIP Final
      run: |
        mkdir -p ~/output
        cd ~/ErfanGSIs/output/
        # Redenumim fișierul final în BestiaOS
        mv *.img BestiaOS-Android15-RedmiK20Pro.img
        zip -r ~/output/BestiaOS-Android15-RedmiK20Pro.zip BestiaOS-Android15-RedmiK20Pro.img

    - name: Încărcare Produs Final (ROM .zip)
      uses: actions/upload-artifact@v4
      with:
        name: BestiaOS-Android15-RedmiK20Pro
        path: /home/runner/output/*.zip
