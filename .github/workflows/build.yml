name: Build BestiaOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-22.04
    
    steps:
    # 1. Descărcarea codului din repository-ul tău
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Eliberarea spațiului pe disc (Maximize Build Space)
    # Runner-ele GitHub standard au ~14 GB liberi. Acest pas șterge unelte nefolosite pentru a elibera ~30-40 GB.
    - name: Maximize Build Space
      run: |
        echo "=== Spatiu initial ==="
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        echo "=== Spatiu dupa curatare ==="
        df -h

    # 3. Verificarea sintaxei fișierelor de configurare (ex: manifest XML sau scripturi)
    - name: Syntax and Lint Verification
      run: |
        echo "=== Verificare sintaxa manifest/configurari ==="
        # Verifica daca exista fisiere XML (folosite des in Android pentru incarcarea surselor)
        if [ -f manifests/config.xml ]; then
          xmllint --noout manifests/config.xml || { echo "CRITICAL: Eroare de sintaxa in config.xml!"; exit 1; }
        else
          echo "Nu s-a gasit un fisier de configurare XML standard. Se trece mai departe."
        fi

    # 4. Validarea linkurilor externe (Sursa codului)
    # Acest pas testeaza daca serverele sau repourile de unde descarci codul sunt online (Cod HTTP 200/302)
    - name: Validate External Sources and Links
      run: |
        echo "=== Validare linkuri si conexiuni ==="
        
        # Lista de linkuri de baza pentru Android/BestiaOS (Adauga aici linkurile tale)
        LINKS=(
          "https://github.com"
          "https://googlesource.com"
        )
        
        FAILED=0
        for link in "${LINKS[@]}"; do
          echo "Se verifica: $link"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --connect-timeout 10 "$link")
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 302 ]; then
            echo "--------------------------------------------------"
            echo "❌ EROARE CRITICA: Linkul $link a returnat statusul $STATUS"
            echo "--- DETALII AVANSATE ---"
            echo "Serverul tinta este fie offline, fie calea URL este gresita, fie blocheaza cererile automate."
            echo "--- DETALII SUPER AVANSATE (DEPANARE) ---"
            echo "1. Ruleaza local comandat: curl -I $link pentru a vedea headerele de raspuns."
            echo "2. Daca este un repository privat, asigura-te ca ai configurat un SSH Key sau GitHub Token valid."
            echo "3. Verifica daca serverul are restrictii de tip Rate Limiting pentru IP-urile GitHub Actions."
            echo "--------------------------------------------------"
            FAILED=1
          else
            echo "✅ Link valid ($STATUS): $link"
          fi
        done
        
        if [ $FAILED -ne 0 ]; then
          echo "Procesul s-a oprit deoarece unul sau mai multe linkuri sunt invalide."
          exit 1
        fi

    # 5. Instalarea uneltelor necesare pentru compilarea Android (Repo, Java, dependinte)
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    # 6. Initializarea si descarcarea surselor BestiaOS
    # NOTA: Android are nevoie de peste 100GB-300GB pentru surse complete. 
    # Folosim '--depth=1' pentru a descarca doar ultima versiune si a economisi spatiu.
    - name: Repo Sync (Fetch Source Code)
      run: |
        git config --global user.name "BestiaOS Builder"
        git config --global user.email "builder@bestiaos.local"
        
        # Inlocuieste cu URL-ul real al manifestului BestiaOS cand este gata
        # repo init -u https://googlesource.com/platform/manifest -b android-13.0.0_r1
        # repo sync -c -j$(nproc) --no-tags --no-clone-bundle --depth=1

    # 7. Compilarea propriu-zisa (Exemplu generic)
    - name: Run Build
      run: |
        echo "Pornire compilare BestiaOS..."
        # source build/envsetup.sh
        # lunch aosp_arm64-userdebug
        # make -j$(nproc)
